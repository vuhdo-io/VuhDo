name: Publish wiki

on:
  push:
    branches:
      - midnight
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-out

      - name: Mirror wiki folder
        run: rsync -a --delete --exclude '.git' --exclude '.gitkeep' wiki/ wiki-out/

      # Wiki pages are served from a flat URL namespace, so image paths
      # relative to a page's subfolder must be rewritten relative to the wiki root.
      - name: Rewrite subfolder image paths
        working-directory: wiki-out
        run: |
          find . -mindepth 2 -name '*.md' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' tFile; do
            tDir="$(dirname "${tFile#./}")"
            sed -i -E \
              -e "s#\]\((\./)?images/#](${tDir}/images/#g" \
              -e "s#src=\"(\./)?images/#src=\"${tDir}/images/#g" \
              "$tFile"
          done

      - name: Commit and push
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD